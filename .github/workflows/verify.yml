name: Verify game
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:models
      - run: pnpm verify:damage-models
      - run: pnpm verify:life-bars
      - run: pnpm verify:explosions
      - run: pnpm verify:arena
      - run: pnpm build
